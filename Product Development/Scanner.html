<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan a QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Simple styling -->
  <link rel="stylesheet" href="Pretty.css">

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<header class="scan-header">
  <h1>Scan a Code</h1>
  <p>Point your camera at a QR code to view a student project.</p>
</header>

<div id="reader"></div>

<button class="back-btn" onclick="goBack()">← Back</button>

<script>
  // Create the QR scanner
  const scanner = new Html5Qrcode("reader");

  // Start the camera
  scanner.start(
    { facingMode: "environment" }, // Use back camera
    { fps: 10, qrbox: 250 },

    // When a QR code is detected
    qrText => {
      window.location.href = qrText;
    },

    error => {
      console.log(error);
    }
  ).catch(err => {
    alert("Camera could not be opened.");
  });

  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
