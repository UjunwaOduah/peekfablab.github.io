<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan a QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="pretty.css">

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<header class="scan-header">
  <h1>Scan a Code</h1>
  <p>Point your camera at a QR code to view a student project.</p>
</header>

<div id="reader"></div>

<button class="btn back-btn" onclick="goBack()">← Back</button>

<script>
  const scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },

    (qrText) => {
      // Normalize scanned text
      const code = qrText.trim().toLowerCase();

      // Match known project codes
      if (code === "lamp") {
        window.location.href = "lamp.html";
      } else {
        alert("Unknown QR code.");
      }
    },

    () => {}
  ).catch(() => {
    alert("Camera could not be opened.");
  });

  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
